<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Simple Bank App - Blue Version</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #1e3c72; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: #ffffff; 
            color: #333333; 
            padding: 30px; 
            border-radius: 8px; 
            width: 350px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
        }
        .badge { 
            background-color: #007bff; 
            color: white; 
            padding: 6px 12px; 
            border-radius: 4px; 
            font-size: 12px; 
            font-weight: bold; 
            display: inline-block; 
            margin-bottom: 15px; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button:hover { 
            background-color: #0056b3; 
        }
        a { 
            color: #007bff; 
            text-decoration: none; 
            font-size: 14px; 
        }
    </style>
</head>
<body>
    <div class="login-card">
        <span class="badge">BLUE ENVIRONMENT (V1.0)</span>
        <h2>Simple Bank Login</h2>
        <form th:action="@{/login}" method="post">
            <input type="text" name="username" placeholder="Username" required />
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit">Login</button>
        </form>
        <p style="margin-top: 15px;"><a href="/register">Don't have an account? Register here</a></p>
    </div>
</body>
</html>
